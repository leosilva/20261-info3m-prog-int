<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Validação preenchimento mínimo</title>
		<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
		<script type="text/javascript">
			function validar() {
				let senha = $('input[name="senha"]').val()
				if (senha.length < 3) {
					alert("A sua senha deve ter, no mínimo, 3 caracteres!")
					return false 
				}
				return true
			}
		</script>
	</head>
	<body>
		<form action="" name="cadastro" onsubmit="return validar()">
			Senha: <input name="senha" type="password" />
			<input name="enviar" type="submit" value="Enviar" />
		</form>
	</body>
</html>
