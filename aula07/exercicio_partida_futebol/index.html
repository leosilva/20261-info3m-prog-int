<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Partida - Liga Amadora</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="script.js"></script>
    <style>
        body { font-family: sans-serif; margin: 20px; line-height: 1.6; }
        .campo { margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; }
        label { font-weight: bold; }
        .error-msg { color: red; display: none; font-size: 0.9em; }
    </style>
</head>
<body>

    <h2>Registro de Partida de Futebol</h2>

    <form name="cadastroPartida" id="formPartida">
        <div class="campo">
            <label>Time da Casa:</label><br>
            <input type="text" name="timeCasa" id="timeCasa">
        </div>

        <div class="campo">
            <label>Time Visitante:</label><br>
            <input type="text" name="timeVisitante" id="timeVisitante">
        </div>

        <div class="campo">
            <label>Placar:</label><br>
            <input type="number" name="golsCasa" min="0" style="width: 40px;"> x 
            <input type="number" name="golsVisitante" min="0" style="width: 40px;">
        </div>

        <div class="campo">
            <label>Local do Jogo:</label><br>
            <input type="radio" name="local" value="estadio"> Estádio Principal
            <input type="radio" name="local" value="campo2"> Campo Secundário
            <input type="radio" name="local" value="visitante"> Campo do Visitante
        </div>

        <div class="campo">
            <label>Destaques da Partida (Selecione pelo menos 2):</label><br>
            <input type="checkbox" name="destaques" value="golaço"> Golaço
            <input type="checkbox" name="destaques" value="fairplay"> Fair Play
            <input type="checkbox" name="destaques" value="defesa"> Grande Defesa
            <input type="checkbox" name="destaques" value="torcida"> Torcida Animada
        </div>

        <div class="campo">
            <input type="checkbox" name="termoVeracidade"> Confirmo que os dados inseridos são verdadeiros.
        </div>

        <input type="submit" value="Registrar Partida">
    </form>
</body>
</html>
