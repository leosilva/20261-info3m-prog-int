<!DOCTYPE html>
<html lang="pt-br">
	<head>
		<meta charset="UTF-8">
		<title>Validação de seleção mínima (checkbox)</title>
		<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
		<script type="text/javascript">
			function validar() {
				// Seleciona apenas as checkboxes marcadas dentro do grupo 'turnos' 
				let marcados = $('input[name="turnos"]:checked').length
				if (marcados < 2) {
					alert("Selecione pelo menos dois turnos!"); 

					return false
				}
				return true
			}
		</script>
	</head>
	<body>
		<form action="" name="cadastro" onsubmit="return validar()">
			Em quais turnos você permanecerá no campus?<br/>
			<input type="checkbox" name="turnos" value="manha" /> Manhã<br/>
			<input type="checkbox" name="turnos" value="tarde" /> Tarde<br/>
			<input type="checkbox" name="turnos" value="noite" /> Noite<br/><br/>
			<input name="enviar" type="submit" value="Enviar" />
		</form>
	</body>
</html>
