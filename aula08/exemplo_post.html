<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo requisição POST com jQuery e Ajax</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        // Executa o script somente depois que todos os elementos da página estiverem disponíveis.
        $(document).ready(function() {
            // Associa ao botão o evento de clique que iniciará o envio dos dados.
            $("#btnEnviar").on("click", function() {
                $.ajax({
                    // Endereço da API que receberá os dados do novo post.
                    url: "https://jsonplaceholder.typicode.com/posts",
                    // Define que a comunicação com o servidor será feita pelo método POST.
                    type: "POST",
                    // Monta o objeto com os dados digitados pelo usuário para envio.
                    data: {
                        title: $("#titulo").val(),
                        body: $("#conteudo").val(),
                        userId: 1
                    },
                    // Se a API aceitar o envio, mostra o identificador do registro criado.
                    success: function(response) {
                        $("#resposta").html(
                            "Post criado com ID: " + response.id
                        );
                    },
                    // Se ocorrer algum problema no envio, informa o erro ao usuário.
                    error: function() {
                        $("#resposta").html("Erro ao enviar dados.");
                    }
                });
            });
        });
    </script>
</head>
<body>
    <input type="text" id="titulo" placeholder="Digite um título">
    <textarea id="conteudo" placeholder="Digite o conteúdo"></textarea>
    <button id="btnEnviar">Enviar</button>

    <div id="resposta"></div>
</body>
</html>
